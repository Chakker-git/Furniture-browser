# Retailer registry.
#
# platform: auto | shopify | woocommerce | sitemap | feed
#   auto     -> probe Shopify, then WooCommerce Store API, then sitemap + JSON-LD
#   feed     -> requires feed_url (+ feed_format = "google" | "csv"); preferred whenever
#               a retailer offers one via an affiliate network (Awin, Adtraction,
#               Partner-ads) or directly. Legal, complete and cheap.
# currency:  default currency if the source omits it
# product_url_pattern: regex to pick product pages out of the sitemap (optional)
# max_pages: cap on pages/API pages fetched per run
# furniture_only: drop rows we can't classify into a furniture category
#                 (needed for general retailers such as OTTO, Bilka, vidaXL)
#
# NONE of these have been verified from the build sandbox (no network access to
# retailer hosts). Run `python -m fb probe` on a machine with internet to see what
# each site actually exposes, then pin platform/patterns here.
# "risk" notes are expectations, not facts: confirm per site.

[defaults]
delay_seconds = 2.0
max_pages = 3000

